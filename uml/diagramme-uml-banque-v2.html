<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagramme UML — Banque (Oracle objet-relationnel) v2</title>
<style>
  :root{
    --bg:#0b1020; --bg2:#111833; --card:#151d3a; --card2:#1b2548; --line:#7f8bb3; --text:#e8ecff; --muted:#8e9bc9;
    --blue:#4f8cff; --violet:#a06bff; --teal:#22c9a6; --amber:#ffb454; --slate:#7f93b8; --rose:#ff6b8b;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f3f5fb; --bg2:#e8ecf7; --card:#ffffff; --card2:#f1f4fc; --line:#6b7699; --text:#1a2140; --muted:#5d6890; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Inter","Segoe UI",system-ui,sans-serif; color:var(--text);
    background:radial-gradient(1200px 700px at 20% -10%, var(--bg2), var(--bg));
    overflow:auto;
  }
  .top{
    position:sticky; top:0; left:0; z-index:50; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:12px 24px; backdrop-filter:blur(10px); background:color-mix(in srgb, var(--bg) 80%, transparent);
    border-bottom:1px solid color-mix(in srgb, var(--line) 30%, transparent);
  }
  .top h1{font-size:17px; margin:0; font-weight:700; letter-spacing:.2px}
  .top small{color:var(--muted); font-weight:400}
  .spacer{flex:1}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted)}
  .legend span{display:flex; align-items:center; gap:6px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .zoom button{
    background:var(--card); color:var(--text); border:1px solid color-mix(in srgb,var(--line) 40%,transparent);
    border-radius:8px; padding:5px 11px; cursor:pointer; font-size:14px;
  }
  .zoom button:hover{background:var(--card2)}
  #wrap{position:relative}
  #stage{position:absolute; left:0; top:0; width:2100px; height:1450px; transform-origin:0 0}
  #edges{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
  .cls{
    position:absolute; width:300px; background:var(--card); border-radius:14px; overflow:hidden;
    border:1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    box-shadow:0 10px 30px rgba(0,0,0,.28);
    transition:transform .15s, box-shadow .15s;
  }
  .cls:hover{transform:translateY(-2px); box-shadow:0 14px 36px rgba(0,0,0,.38), 0 0 0 2px color-mix(in srgb,var(--accent) 60%,transparent)}
  .cls header{
    padding:10px 14px 9px; text-align:center;
    background:linear-gradient(135deg, color-mix(in srgb,var(--accent) 85%, #000), color-mix(in srgb,var(--accent) 55%, #000));
  }
  .stereo{font-size:10.5px; letter-spacing:.6px; text-transform:uppercase; opacity:.85; color:#fff; line-height:1.3}
  .cname{font-weight:700; font-size:15px; color:#fff}
  .abstract .cname{font-style:italic}
  .sec{padding:8px 14px; font-family:"JetBrains Mono","Fira Code",Consolas,monospace; font-size:12px}
  .sec + .sec{border-top:1px solid color-mix(in srgb,var(--line) 30%, transparent); background:var(--card2)}
  .row{display:flex; gap:6px; padding:2.5px 0; align-items:baseline; white-space:nowrap}
  .row .n{color:var(--text)}
  .row .t{color:var(--accent); margin-left:auto; padding-left:10px; text-align:right}
  .row .v{color:var(--muted); width:10px; flex:none}
  .row.st .n{text-decoration:underline}
  .elabel{font-size:11.5px; fill:var(--text); paint-order:stroke; stroke:var(--bg); stroke-width:5px; stroke-linejoin:round; font-weight:600}
  .emult{font-size:11px; fill:var(--muted); paint-order:stroke; stroke:var(--bg); stroke-width:4px; font-weight:600}
</style>
</head>
<body>
<div class="top">
  <h1>Gestion d'une banque <small>· modèle objet-relationnel Oracle</small></h1>
  <div class="spacer"></div>
  <div class="legend">
    <span><i class="dot" style="background:var(--blue)"></i>Type objet</span>
    <span><i class="dot" style="background:var(--violet)"></i>Classe abstraite</span>
    <span><i class="dot" style="background:var(--teal)"></i>Sous-type</span>
    <span><i class="dot" style="background:var(--amber)"></i>Table relationnelle</span>
    <span><i class="dot" style="background:var(--rose)"></i>Vue objet</span>
    <span><i class="dot" style="background:var(--slate)"></i>Structuré / collection</span>
  </div>
  <div class="zoom"><button id="zo">−</button> <button id="zf">Ajuster</button> <button id="zi">+</button></div>
</div>

<div id="wrap">
  <div id="stage">
    <svg id="edges" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
          <path d="M1 1 L11 6 L1 11" fill="none" stroke="#9aa7d4" stroke-width="1.6"/>
        </marker>
        <marker id="tri" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto">
          <path d="M1 1 L15 8 L1 15 Z" fill="var(--bg)" stroke="#9aa7d4" stroke-width="1.6"/>
        </marker>
        <marker id="dia-f" viewBox="0 0 20 12" refX="1" refY="6" markerWidth="20" markerHeight="12" orient="auto">
          <path d="M1 6 L10 1 L19 6 L10 11 Z" fill="#9aa7d4" stroke="#9aa7d4" stroke-width="1.4"/>
        </marker>
      </defs>
      <g id="lines"></g>
      <g id="labels"></g>
    </svg>
  </div>
</div>

<script>
/* ---------- Données du modèle ---------- */
/* attrs: [nom, type] ; methods: [texte, static, -, retour] */
const C = {
  adresse_type:{x:40,y:40,kind:"object",stereo:"object",
    attrs:[["num_rue","Number"],["rue","String"],["ville","String"],["cp","String"]]},
  client_type:{x:40,y:250,kind:"object",stereo:"object",
    attrs:[["num_client","Number"],["nom","String"],["prenom","String"],["date_naissance","Date"],["num_secu","String"],
           ["adresse","adresse_type"],["telephones","tel_vry_type"],["email","String"],["date_entree","Date"],
           ["ref_conseiller","REF"],["ref_parrain","REF"]],
    methods:[["nbCepargne()",0,0,"Number"],["soldeTotal()",0,0,"Number"],["supprimeTel(indice)"],["afficheInterets()"]]},
  tel_vry_type:{x:40,y:830,kind:"struct",stereo:"VARRAY(3) of VARCHAR2",noVis:1,
    attrs:[["domicile",""],["portable1",""],["portable2",""]]},
  conseiller_type:{x:460,y:40,kind:"object",stereo:"object",
    attrs:[["num_conseiller","Number"],["nom","String"],["prenom","String"],["specialite","String"],["date_embauche","Date"],["salaire","Number"]]},
  affectation:{x:460,y:340,kind:"rel",stereo:"relationnelle",
    attrs:[["id_affectation","Number"],["date_debut","Date"],["date_fin","Date"]]},
  agence_type:{x:880,y:40,kind:"object",stereo:"object",
    attrs:[["code","String"],["nom","String"],["ville","String"],["ref_responsable","REF"]]},
  agence_vor_type:{x:1300,y:300,kind:"vue",stereo:"object, vue",
    attrs:[["code","String"],["nom","String"],["conseillers","conseiller_nt_type"],["comptes","cptCourant_nt_type"]],
    methods:[["mutation(nConseiller, nAgenceCible)"]]},
  compte_type:{x:880,y:620,kind:"abstract",stereo:"abstract, NOT FINAL, NOT INSTANTIABLE",
    attrs:[["num_compte","String"],["solde","Number"],["date_ouverture","Date"],["statut","String"],["ref_client","REF"],["ref_agence","REF"]],
    methods:[["fraisTenue()",0,0,"Number"],["fermeCompte(cpt)",1]]},
  cptCourant_type:{x:1300,y:620,kind:"sub",stereo:"object",
    attrs:[["decouvert","Number"],["nb_op_cb","Number"],["signataires","signataire_nt_type"]],
    methods:[["nbSignataire()",0,0,"Number"],["nbSignataire(droit)",0,0,"Number"],["estTitulaire(cli)",0,0,"Boolean"],
             ["estSignataire(cli, droit)",0,0,"Boolean"],["supprimeSign(nclient)"],["passeMvt(cli, somme)"],
             ["peutRetirer(cli, somme)",0,0,"Boolean"]]},
  signataire_elt_nt_type:{x:1300,y:1050,kind:"struct",stereo:"nested table element",
    attrs:[["droit","char"]]},
  operation_type:{x:460,y:800,kind:"object",stereo:"object",
    attrs:[["id_op","Number"],["date_op","Date"],["montant","Number"],["type_op","String"],["commission","Number"]]},
  cptEpargne_type:{x:460,y:1080,kind:"sub",stereo:"object",
    attrs:[["taux_interet","Number"],["plafond_depot","Number"]],
    methods:[["calculeInterets()",0,0,"Number"],["sortieAnticipee()",0,0,"Number"]]},
  cptTerme_type:{x:880,y:1080,kind:"sub",stereo:"object",
    attrs:[["montant_bloque","Number"],["duree_mois","Number"],["date_echeance","Date"],["taux_garanti","Number"]],
    methods:[["calculeInterets()",0,0,"Number"],["sortieAnticipee()",0,0,"Number"]]},
  releves:{x:1720,y:40,kind:"rel",stereo:"relationnelle",
    attrs:[["annee","Number"],["mois_vry","mois_vry_type"]]},
  mois_elt_vry_type:{x:1720,y:260,kind:"struct",stereo:"object (élément VARRAY)",
    attrs:[["mois","Number"],["nb_operations","Number"],["types","type_stat_nt_type"]]},
  type_stat_elt_nt_type:{x:1720,y:500,kind:"struct",stereo:"object (élément nested table)",
    attrs:[["type_op","String"],["nb","Number"],["montant_total","Number"]]}
};
const ACCENT = {object:"--blue", abstract:"--violet", sub:"--teal", rel:"--amber", struct:"--slate", vue:"--rose"};

/* type: assoc | inh | comp (losange plein côté "from") | self */
const E = [
  {f:"cptCourant_type",t:"compte_type",type:"inh"},
  {f:"cptEpargne_type",t:"compte_type",type:"inh"},
  {f:"cptTerme_type",t:"compte_type",type:"inh"},
  {f:"client_type",t:"client_type",type:"self",l:"parrain",m1:"1",m2:"0..1"},
  {f:"client_type",t:"conseiller_type",type:"assoc",l:"conseiller attitré",m1:"1",m2:"0..1"},
  {f:"agence_type",t:"conseiller_type",type:"assoc",l:"responsable",m1:"1",m2:"1"},
  {f:"conseiller_type",t:"affectation",type:"assoc",l:"historique",m1:"1",m2:"0..*"},
  {f:"agence_type",t:"affectation",type:"assoc",l:"affecte à",m1:"1",m2:"0..*"},
  {f:"client_type",t:"compte_type",type:"assoc",l:"titulaire",m1:"1",m2:"0..*"},
  {f:"agence_type",t:"compte_type",type:"assoc",l:"domiciliation",m1:"1",m2:"0..*"},
  {f:"compte_type",t:"operation_type",type:"assoc",l:"mouvements",m1:"1",m2:"0..*"},
  {f:"client_type",t:"operation_type",type:"assoc",l:"auteur",m1:"1",m2:"0..*"},
  {f:"cptCourant_type",t:"signataire_elt_nt_type",type:"comp",l:"signataires",m1:"1",m2:"0..*"},
  {f:"client_type",t:"signataire_elt_nt_type",type:"assoc",l:"est signataire",m1:"1",m2:"0..*"},
  {f:"client_type",t:"tel_vry_type",type:"comp",l:"telephones",m1:"1",m2:"0..3"},
  {f:"client_type",t:"adresse_type",type:"comp",l:"adresse",m1:"1",m2:"1"},
  {f:"releves",t:"mois_elt_vry_type",type:"comp",l:"mois_vry",m1:"1",m2:"0..12"},
  {f:"mois_elt_vry_type",t:"type_stat_elt_nt_type",type:"comp",l:"types",m1:"1",m2:"0..*"},
  {f:"agence_vor_type",t:"conseiller_type",type:"comp",l:"conseillers",m1:"1",m2:"0..*"},
  {f:"agence_vor_type",t:"cptCourant_type",type:"comp",l:"comptes",m1:"1",m2:"0..*"}
];

/* ---------- Rendu des classes ---------- */
const stage = document.getElementById("stage");
const el = {};
for (const [name,c] of Object.entries(C)){
  const d = document.createElement("div");
  d.className = "cls" + (c.kind==="abstract" ? " abstract" : "");
  d.style.cssText = `left:${c.x}px; top:${c.y}px; --accent:var(${ACCENT[c.kind]})`;
  const v = c.noVis ? "" : "+";
  let h = `<header><div class="stereo">«${c.stereo}»</div><div class="cname">${name}</div></header>`;
  h += `<div class="sec">` + c.attrs.map(a=>`<div class="row"><span class="v">${v}</span><span class="n">${a[0]}</span><span class="t">${a[1]}</span></div>`).join("") + `</div>`;
  if (c.methods) h += `<div class="sec">` + c.methods.map(m=>
      `<div class="row ${m[1]?'st':''}"><span class="v">+</span><span class="n">${m[0]}</span><span class="t">${m[3]||""}</span></div>`).join("") + `</div>`;
  d.innerHTML = h;
  stage.appendChild(d); el[name]=d;
}

/* ---------- Connecteurs ---------- */
const NS = "http://www.w3.org/2000/svg";
const linesG = document.getElementById("lines"), labelsG = document.getElementById("labels");
const R = n => { const e = el[n]; return {x:e.offsetLeft,y:e.offsetTop,w:e.offsetWidth,h:e.offsetHeight}; };
const ctr = r => ({x:r.x+r.w/2, y:r.y+r.h/2});
function exit(r,p,d){
  const tx = d.x>0 ? (r.x+r.w-p.x)/d.x : d.x<0 ? (r.x-p.x)/d.x : Infinity;
  const ty = d.y>0 ? (r.y+r.h-p.y)/d.y : d.y<0 ? (r.y-p.y)/d.y : Infinity;
  const t = Math.min(tx,ty); return {x:p.x+d.x*t, y:p.y+d.y*t};
}
function text(cls,x,y,s,anchor="middle"){
  const t = document.createElementNS(NS,"text");
  t.setAttribute("class",cls); t.setAttribute("x",x); t.setAttribute("y",y); t.setAttribute("text-anchor",anchor);
  t.textContent = s; labelsG.appendChild(t);
}
function mk(tag,attrs){ const n=document.createElementNS(NS,tag); for(const k in attrs) n.setAttribute(k,attrs[k]); return n; }
function draw(){
  linesG.innerHTML=""; labelsG.innerHTML="";
  for (const e of E){
    if (e.type==="self"){
      const r=R(e.f), x=r.x+r.w, y1=r.y+70, y2=r.y+140;
      linesG.appendChild(mk("path",{d:`M ${x} ${y1} C ${x+80} ${y1-12}, ${x+80} ${y2+12}, ${x} ${y2}`,
        fill:"none",stroke:"#9aa7d4","stroke-width":1.6,"marker-end":"url(#arrow)"}));
      text("elabel",x+62,(y1+y2)/2+4,e.l,"start");
      text("emult",x+10,y1-6,e.m1,"start"); text("emult",x+10,y2+16,e.m2,"start");
      continue;
    }
    const r1=R(e.f), r2=R(e.t), c1=ctr(r1), c2=ctr(r2);
    const dx=c2.x-c1.x, dy=c2.y-c1.y;
    const p1=exit(r1,c1,{x:dx,y:dy}), p2=exit(r2,c2,{x:-dx,y:-dy});
    const ln=mk("line",{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,stroke:"#9aa7d4","stroke-width":1.6,"stroke-linecap":"round"});
    if (e.type==="assoc") ln.setAttribute("marker-end","url(#arrow)");
    if (e.type==="inh") ln.setAttribute("marker-end","url(#tri)");
    if (e.type==="comp") ln.setAttribute("marker-start","url(#dia-f)");
    linesG.appendChild(ln);
    const ux=p2.x-p1.x, uy=p2.y-p1.y, ul=Math.hypot(ux,uy)||1, tx=ux/ul, ty=uy/ul, px=-ty, py=tx;
    if (e.l) text("elabel", p1.x+ux*.5+px*-9, p1.y+uy*.5+py*-9+4, e.l);
    if (e.m1) text("emult", p1.x+tx*22+px*13, p1.y+ty*22+py*13+4, e.m1);
    if (e.m2) text("emult", p2.x-tx*24+px*13, p2.y-ty*24+py*13+4, e.m2);
  }
}

/* ---------- Zoom ---------- */
let scale=1;
const wrap=document.getElementById("wrap");
function apply(){ stage.style.transform=`scale(${scale})`; wrap.style.width=(2100*scale)+"px"; wrap.style.height=(1450*scale)+"px"; }
function fit(){ scale=Math.min(1,(innerWidth-20)/2100); apply(); }
zi.onclick=()=>{scale=Math.min(2,scale+.1);apply()};
zo.onclick=()=>{scale=Math.max(.2,scale-.1);apply()};
zf.onclick=fit;
addEventListener("resize",fit);
draw(); fit();
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{draw();fit();});
</script>
</body>
</html>
